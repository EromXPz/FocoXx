name: Build FocoX APK (profile arm64)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-profile-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze
      - name: Build profile APK for 64-bit ARM only
        run: flutter build apk --profile --target-platform android-arm64
      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-profile.apk
      - name: Verify APK archive
        run: unzip -t build/app/outputs/flutter-apk/app-profile.apk
      - name: Upload profile APK
        uses: actions/upload-artifact@v4
        with:
          name: FocoX-profile-arm64-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 7
