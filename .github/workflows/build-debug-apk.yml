name: Build FocoX Dev APK (offline, arm64)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze
      - name: Build PROFILE APK for ARM64 with explicit .dev application ID
        run: flutter build apk --profile --target-platform android-arm64 --build-number="${GITHUB_RUN_NUMBER}"
      - name: Verify APK archive
        run: unzip -t build/app/outputs/flutter-apk/app-profile.apk
      - name: Verify package ID and architecture
        run: |
          APK=build/app/outputs/flutter-apk/app-profile.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='app.focox.android.dev'"
          "$AAPT" dump badging "$APK" | grep -F "native-code: 'arm64-v8a'"
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-profile.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          sha256sum "$APK"
      - name: Upload FocoX Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: FocoX-dev-profile-arm64
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 7
